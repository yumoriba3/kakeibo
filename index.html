<body>
<title>出納帳</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="出納帳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: 片手で操作する縦長の出納帳。上に月次サマリー、中央に作業面、下にタブバー */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#16233A; --muted:#5D6A7E; --line:#DCE2E9;
  --accent:#0E6B74; --accent-ink:#FFFFFF; --accent-soft:#E0EFF0;
  --exp:#B0443A; --inc:#2B6B47; --warn-soft:#FBEAE7;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --font-num:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D131B; --surface:#151F2A; --ink:#E5EBF2; --muted:#93A1B4; --line:#253241;
  --accent:#4DB0BA; --accent-ink:#0B1A1D; --accent-soft:#15343A;
  --exp:#E57C70; --inc:#6CC18F; --warn-soft:#3A1E1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131B; --surface:#151F2A; --ink:#E5EBF2; --muted:#93A1B4; --line:#253241;
  --accent:#4DB0BA; --accent-ink:#0B1A1D; --accent-soft:#15343A;
  --exp:#E57C70; --inc:#6CC18F; --warn-soft:#3A1E1B; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px 12px;display:grid;gap:10px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0}
.syncdot{white-space:nowrap;letter-spacing:.04em;font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.syncdot.warn{background:var(--warn-soft);color:var(--exp)}
.linkline{font-size:12.5px;color:var(--accent)}
.mnav{display:flex;align-items:center;gap:4px}
.mnav button{width:36px;height:36px;border:0;background:transparent;border-radius:50%;color:var(--accent);font-size:20px;line-height:1}
.mnav button:active{background:var(--accent-soft)}
.mlabel{font-weight:700;font-size:17px;min-width:7.5em;text-align:center}
.bname{overflow:hidden;text-overflow:ellipsis}
@media (max-width:430px){.mlabel{min-width:6.2em}.brand{letter-spacing:.1em}}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{display:grid;gap:0;min-width:0}
.sum span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.sum b{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .bal b{color:var(--accent)}
.sum .bal.neg b{color:var(--exp)}

main .wrap{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;min-width:0}
h2{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0;text-wrap:balance}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:8px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.seg button[aria-pressed="true"][data-t="exp"]{color:var(--exp)}
.seg button[aria-pressed="true"][data-t="inc"]{color:var(--inc)}

/* form */
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amount:focus-within{border-color:var(--accent)}
.amount span{font-family:var(--font-num);font-size:24px;color:var(--muted)}
.amount input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--font-num);font-size:34px;font-weight:500;padding:0;outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.field{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:16px;color:var(--ink)}
.field:focus{outline:none;border-color:var(--accent)}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 8px;font-size:13.5px;text-align:left;min-width:0}
.chip i{flex:none;width:8px;height:8px;border-radius:50%}
.chip em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.sugs{display:flex;gap:6px;overflow-x:auto;margin-top:-6px;padding-bottom:2px;scrollbar-width:none;align-items:center}
.sugs::-webkit-scrollbar{display:none}
.sugs.wrapall{flex-wrap:wrap;overflow:visible;margin-top:0}
.sugl{flex:none;font-size:11px;color:var(--muted);letter-spacing:.06em}
.sug{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;max-width:100%}
button.sug:active{background:var(--accent-soft);border-color:var(--accent)}
.sug i{width:6px;height:6px;border-radius:50%;flex:none}
.sug small{color:var(--muted);font-size:11px}
.sug .x{border:0;background:transparent;color:var(--exp);padding:0 0 0 4px;font-size:14px;line-height:1}
.subrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:-4px}
.subchip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px}
.subchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.subn{color:var(--muted);font-size:12.5px;font-weight:400}
button.brow{border:0;background:transparent;padding:0;text-align:left;width:100%;font:inherit;color:inherit}
button.brow:disabled{cursor:default;opacity:1}
.chev{color:var(--muted);font-size:11px;margin-left:6px}
.subbars{display:grid;gap:4px;margin:-4px 0 4px 12px;padding-left:10px;border-left:2px solid var(--line);font-size:12.5px}
.subbars .l{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.subbars .l small{margin-left:6px}
.subcount{display:block;font-size:11px;color:var(--muted);font-weight:400}
.catpanel{display:grid;gap:10px;padding:12px;margin:2px 0 10px 20px;border:1px solid var(--accent);border-radius:12px;background:var(--bg)}
.catpanel .field{background:var(--surface)}
.catpanel .addrow .btn{padding:9px 12px;font-size:14px}
.cat.sub{grid-template-columns:6px minmax(0,1fr) auto}
.cat.sub i{width:6px;height:6px;background:var(--line)}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:16px}
.btn:active{opacity:.85}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--warn-soft);color:var(--exp)}
.btns{display:grid;grid-template-columns:1fr;gap:8px}
.btns.two{grid-template-columns:1fr 1fr}

/* lists */
.day{display:grid;gap:0}
.dayhead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:4px 2px;border-bottom:1px solid var(--line)}
.ent{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.ent:last-child{border-bottom:0}
.ent i{width:8px;height:8px;border-radius:50%}
.ent .t{min-width:0;display:grid}
.ent .t small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .a{font-size:15px}
.ent .a.inc{color:var(--inc)}
.badge{display:inline-block;margin-left:6px;font-size:10px;font-weight:500;letter-spacing:.06em;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;vertical-align:2px}
.recrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.recrow:last-child{border-bottom:0}
.recrow i{width:8px;height:8px;border-radius:50%}
.recrow .t{display:grid;min-width:0}
.recrow .t small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recrow .a.inc{color:var(--inc)}
.recform{display:grid;gap:12px;border:1px solid var(--accent);border-radius:12px;padding:14px;background:var(--bg)}
.recform .field{background:var(--surface)}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.empty{padding:18px 4px;text-align:center;color:var(--muted);font-size:13.5px}

/* bars */
.bars{display:grid;gap:10px}
.brow{display:grid;gap:4px}
.brow .l{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.brow .l span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .l small{color:var(--muted);font-family:var(--font-num);margin-left:6px}
.track{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.track div{height:100%;border-radius:3px}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px;font-weight:700}

/* settings */
.cat{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.cat:last-of-type{border-bottom:0}
.cat i{width:8px;height:8px;border-radius:50%}
.cat .nm{border:0;background:transparent;text-align:left;padding:4px 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ops{display:flex;gap:4px}
.ops button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:14px;color:var(--muted)}
.ops button.del{color:var(--exp)}
.ops button.del.armed{width:auto;padding:0 10px;background:var(--warn-soft);border-color:transparent;font-size:12px;font-weight:700}
.ops button:disabled{opacity:.35}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.addrow .btn{padding:9px 16px;font-size:15px}
.renamerow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;grid-column:2 / 4}
.renamerow .btn{padding:8px 12px;font-size:14px}
.filebtn{position:relative;overflow:hidden;text-align:center}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.status{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--inc);flex:none;margin-top:6px}
.status.local i{background:var(--exp)}

textarea.copy{width:100%;height:140px;font-family:var(--font-num);font-size:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:8px 0 9px;font-size:11px;color:var(--muted)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:20;max-width:calc(100% - 32px);text-align:center;transition:opacity .2s}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <span class="brand"><span class="bname">MY CASHBOOK</span><span id="syncDot" class="syncdot" hidden></span></span>

        <button id="nextM" aria-label="次の月">›</button>
      </div>
    </div>

  </div>
</header>

<script>
(function(){
"use strict";
const DEFAULT_CATS = {
  exp:["日用雑貨","食材費","外食","通信","サブスク","鎌倉マンション","水道・光熱","医療・保険","美容・衣服","交際費","交通","エンタメ","サーフィン関連","バイク関連","ギター関連","トレーニング関連","雑費","酒類","カーシェアリング","コインパーキング","住まい","税金","大型出費","iDeCo","米国株積立","NISA"],
  inc:["給与所得","楽天証券","日当","還付金","年末調整","臨時収入","賞与","立替金返済","事業所得","その他","楽天証券出金"]
};
/* 小分類の初期値（Zaimで使っていた分類） */
const DEFAULT_SUB = { inc: {}, exp: {
  "日用雑貨": ["日用品","消耗品","小物雑貨","新聞","その他"],
  "外食": ["コンビニコーヒー","弁当","外食","飲料","コンビニ"],
  "通信": ["ペイデイ","楽天モバイル","LINEMO","POVO","NHK","Appleストレージ50GB","Appleストレージ200GB","Yahooプレミアム会員","Yahooメールセキュリティパック","インターネット関連費","放送サービス料金"],
  "サブスク": ["Apple music/storage","Wantedly People","Zaimu premium","Claude code","ウェザーニュース","その他"],

  "医療・保険": ["病院代","歯医者","薬代","アフラックがん保険","アフラックエバーハーフ","チューリッヒフリーケアプログラム","医療保険","その他","都民共済"],
  "美容・衣服": ["マッサージ","散髪","洋服","アクセサリー・小物","下着","ジム・健康","美容院","コスメ","エステ・ネイル","クリーニング","その他","ヘアケア","サプリメント"],
  "交際費": ["外食","飲み会","プレゼント","ご祝儀・香典","その他","募金","積立"],

  "バイク関連": ["パーツ","消耗品","安全装備品","保険","ガソリン","備品","点検","バイク税金","車体","教習所","ウェア"],
  "トレーニング関連": ["道具","プロテイン類","ウェア関係"],
  "雑費": ["お墓参り","サブスク","年会費","契約更新","自己投資","お小遣い","参拝","募金","使途不明金","立替金","未分類","現金の引出"],
  "カーシェアリング": ["基本料","利用料"],
  "大型出費": ["旅行","住宅","自動車","バイク","家具","寝具","結婚","出産","介護","家電"]
} };
const PALETTE = ["#4F7FD6","#7DB547","#D9A441","#5BA7B5","#D0675C","#8A6FD1","#4DA57A","#C9B83C","#D17CA6","#6E8BA8","#E08A4A","#3E9C9C"];
const TYPE_LABEL = {exp:"支出", inc:"収入"};
const NO_SUB = "（小分類なし）";
/* 小分類の一覧。保存データに小分類がまだ無いときは初期値を使う */
function subsOf(t, c){ const sub = S.cats && S.cats.sub ? S.cats.sub : DEFAULT_SUB; return ((sub[t] || {})[c]) || []; }
const APP_VERSION = "2026.10.16-1107"; // 独立版のビルド時に日時が入る

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");
const signedYen = n => (n < 0 ? "▲" : "") + yen(Math.abs(n));
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };
const shiftYM = (ym, k) => { let [y, m] = ym.split("-").map(Number); m += k; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return y + "-" + pad(m); };
const ymLabel = ym => { const [y, m] = ym.split("-"); return y + "年" + Number(m) + "月"; };
const dayLabel = d => { const dt = new Date(d + "T00:00:00"); return Number(d.slice(5,7)) + "月" + Number(d.slice(8)) + "日（" + "日月火水木金土"[dt.getDay()] + "）"; };
const colorOf = name => { let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
const byDate = (p, q) => p.d < q.d ? -1 : p.d > q.d ? 1 : 0;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));
let toastTimer;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200); }
function errMsg(e){
  const c = e && e.code;
  if (c === "quota_exceeded") return "保存容量の上限に達しました。古い月のデータを整理してください";
  if (c === "invalid_argument") return "この閲覧権限では保存できません";
  return "保存できませんでした。通信状態を確認してもう一度お試しください";
}

/* ---------- storage: claude.ai db, fallback to this browser ---------- */
function dbStore(db){
  const chains = {};
  const queue = (k, fn) => { const p = (chains[k] || Promise.resolve()).then(fn); chains[k] = p.catch(() => {}); return p; };
  const get = async path => { const s = await db.doc(path).get(); return s.exists ? clone(s.data()) : null; };
  return {
    mode: "db",
    get,
    watch(path, cb){ return db.doc(path).onSnapshot(s => cb(s.exists ? clone(s.data()) : null), e => console.warn(e)); },
    mutate(path, fn){ return queue(path, async () => { let body; try { body = await get(path); } catch(e){ if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 400 + Math.random()*600)); body = await get(path); } else throw e; } const nb = fn(body); if (nb) await db.doc(path).set(nb); return nb; }); }
  };
}
function localStore(){
  const key = p => "cashbook:" + p;
  const watchers = {};
  const read = p => { try { const v = localStorage.getItem(key(p)); return v ? JSON.parse(v) : null; } catch(e){ return null; } };
  return {
    mode: "local",
    async get(p){ return read(p); },
    watch(p, cb){ (watchers[p] = watchers[p] || []).push(cb); cb(read(p)); return () => { watchers[p] = (watchers[p] || []).filter(f => f !== cb); }; },
    async mutate(p, fn){ const nb = fn(read(p)); if (nb) { try { localStorage.setItem(key(p), JSON.stringify(nb)); } catch(e){ throw {code:"local"}; } (watchers[p] || []).forEach(f => f(clone(nb))); } return nb; }
  };
}

function memoCandidates(){
  const f = S.form, q = (f.m || "").trim().toLowerCase();
  let list = S.memos.filter(x => x.t === f.t && x.m !== f.m);
  if (q) list = list.filter(x => x.m.toLowerCase().includes(q));
  else if (f.c) list = list.filter(x => x.c === f.c);
  const score = x => (f.c && x.c === f.c ? 1e9 : 0) + (q && x.m.toLowerCase().startsWith(q) ? 1e8 : 0) + x.n * 1e3 + (x.last || 0) / 1e10;
  return list.sort((a, b) => score(b) - score(a)).slice(0, 8);
}

  const box = $("#memoSug"); if (!box) return;
  const list = memoCandidates();
  box.hidden = !list.length;
  box.innerHTML = list.length ? '<span class="sugl">候補</span>' + list.map(x =>
    '<button class="sug" data-act="sug" data-m="' + esc(x.m) + '" data-c="' + esc(x.c) + '" data-s="' + esc(x.s || "") + '"><i style="background:' + colorOf(x.c) + '"></i>' + esc(x.m) + '</button>').join("") : "";

function breakdown(type){
  const sums = {};
  S.entries.filter(e => e.t === type).forEach(e => sums[e.c] = (sums[e.c] || 0) + e.a);
  const rows = Object.entries(sums).sort((a, b) => b[1] - a[1]);
  const total = rows.reduce((s, r) => s + r[1], 0), max = rows.length ? rows[0][1] : 1;
  const body = rows.length ? rows.map(([c, v]) => {
    const k = type + "|" + c, open = !!S.repOpen[k];
    const subs = {}; S.entries.filter(e => e.t === type && e.c === c).forEach(e => { const n = e.s || NO_SUB; subs[n] = (subs[n] || 0) + e.a; });
    const subRows = Object.entries(subs).sort((a, b2) => b2[1] - a[1]);
    const hasSub = subRows.some(r => r[0] !== NO_SUB);
    return '<button class="brow' + (hasSub ? ' tap' : '') + '" data-act="repToggle" data-k="' + esc(k) + '"' + (hasSub ? ' aria-expanded="' + open + '"' : ' disabled') + '><div class="l"><span>' + esc(c) + (hasSub ? '<span class="chev">' + (open ? '▾' : '▸') + '</span>' : '') + '</span><span class="num">' + yen(v) + '<small>' + (v / total * 100).toFixed(1) + '%</small></span></div>' +
      '<div class="track"><div style="width:' + (v / max * 100).toFixed(1) + '%;background:' + colorOf(c) + '"></div></div></button>' +
      (open && hasSub ? '<div class="subbars">' + subRows.map(([n, sv]) => '<div class="l"><span>' + esc(n) + '</span><span class="num">' + yen(sv) + '<small>' + (sv / v * 100).toFixed(1) + '%</small></span></div>').join("") + '</div>' : '');
  }).join("")
    : '<p class="empty">' + TYPE_LABEL[type] + 'の記帳はありません。</p>';
  return '<section class="card"><h2>' + TYPE_LABEL[type] + 'の内訳</h2>' + (type === "exp" && rows.length ? '<p class="note">▸の付いた項目を押すと、小分類ごとの金額を表示します。</p>' : '') + '<div class="bars">' + body + '</div>' +
    '<div class="total"><span>' + TYPE_LABEL[type] + '合計</span><span class="num">' + yen(total) + '</span></div></section>';
}

async function applyRecurring(ym, items){
  if (!items.length) return 0;
  let added = 0;
  await S.store.mutate("months/" + ym, b => {
    const body = Object.assign({ entries: [] }, b), applied = (body.applied || []).slice();
    items.forEach(r => { if (applied.includes(r.id)) return; applied.push(r.id); const ne = { id: uid(), d: recDate(ym, r.day), t: r.t, c: r.c, a: r.a, m: r.m || "", r: r.id }; if (r.s) ne.s = r.s; body.entries.push(ne); added++; });
    if (!added) return null;
    body.applied = applied; body.entries.sort(byDate); return body;
  });
  if (added) await addMonthIndex(ym);
  return added;
}
let recRunning = false;
async function runRecurring(){
  if (recRunning || !S.store) return; recRunning = true;
  try {
    const cur = todayStr().slice(0, 7), doc = await S.store.get("settings/recurring"), items = (doc && doc.items) || [];
    if (!items.length || !doc.lastRun || doc.lastRun >= cur) return;
    let start = shiftYM(doc.lastRun, 1);
    if (start < shiftYM(cur, -11)) start = shiftYM(cur, -11);
    let total = 0;
    for (let ym = start; ym <= cur; ym = shiftYM(ym, 1)) total += await applyRecurring(ym, items.filter(r => r.from <= ym));
    await S.store.mutate("settings/recurring", b => Object.assign({ items: [] }, b, { lastRun: cur }));
    if (total) toast("定期の支払い・収入を " + total + " 件記帳しました");
  } catch (e) { toast("定期の記帳に失敗しました。アプリを開き直してください"); }
  finally { recRunning = false; }
}
async function saveRec(){
  const rf = S.recForm, a = parseInt(rf.a, 10), cur = todayStr().slice(0, 7);
  if (!rf.c) return toast("項目を選んでください");
  if (!a || a <= 0) return toast("金額を入力してください");
  const old = rf.id ? S.rec.find(x => x.id === rf.id) : null;
  const r = { id: rf.id || uid(), t: rf.t, c: rf.c, s: rf.s || "", a, day: rf.day, m: (rf.m || "").trim(), from: old ? old.from : (rf.now ? cur : shiftYM(cur, 1)) };
  try {
    await S.store.mutate("settings/recurring", b => {
      const body = Object.assign({ items: [] }, b), i = body.items.findIndex(x => x.id === r.id);
      if (i >= 0) body.items[i] = r; else body.items.push(r);
      if (!body.lastRun) body.lastRun = cur;
      return body;
    });
    if (!old && rf.now) await applyRecurring(cur, [r]);
    toast(old ? "定期登録を更新しました" : (rf.now ? "登録し、今月分を記帳しました" : "登録しました。" + ymLabel(r.from) + "から自動で記帳します"));
    S.recForm = null; renderView();
  } catch (err) { toast(errMsg(err)); }
}
/* ---------- Googleスプレッドシート連携（独立版のみ） ---------- */
const SYNC_KEY = "cashbook:sync";
const SETUP_URL = "https://github.com/yumoriba3/kakeibo/blob/main/SETUP_GOOGLE.md";
const normToken = t => String(t || "").normalize("NFKC").replace(/[\s"“”'‘’]/g, "");
function syncCfg(){ try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; } }
function setSyncCfg(c){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(c)); } catch (e) {} }
const fmtTime = t => { const d = new Date(t); return (d.getMonth() + 1) + "/" + d.getDate() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
async function callSheet(cfg, body){
  let res;
  try { res = await fetch(cfg.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ token: cfg.token }, body)) }); }
  catch (e) { throw new Error("network"); }
  let j; try { j = await res.json(); } catch (e) { throw new Error("response"); }
  if (!j.ok) throw new Error(j.error || "error");
  return j;
}
function syncErrText(code){

let syncTimer = null, syncing = false;
function markDirty(){

async function syncNow(manual){

  if (!c.dirty && !manual) return;

  try {
    await callSheet(c, { action: "save", data: await backupText() });
    const n = syncCfg(); n.lastOk = Date.now(); n.lastErr = ""; if ((n.rev || 0) === rev) n.dirty = false; setSyncCfg(n);

/* claude.ai 上では downloads 機能、独立版では共有シート（なければ通常のダウンロード）で保存 */
async function saveFile(filename, blob){
  const dl = await downloads();
  if (dl) {
    try { await dl.save({ filename, data: blob }); return true; }
    catch (e) { if (e && e.code !== "declined") toast(e && e.code === "rate_limited" ? "少し待ってからもう一度お試しください" : "保存できませんでした"); return false; }
  }
  try {
    const file = new File([blob], filename, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return true; }
  } catch (e) { if (e && e.name === "AbortError") return false; }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; a.hidden = true; document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 60000);
  return true;
}

async function exportBackup(){
  let json;
  try { json = await backupText(); } catch (e) { return toast("データを読み込めませんでした。もう一度お試しください"); }
  if (await saveFile("kakeibo_backup_" + todayStr() + ".json", new Blob([json], { type: "application/json" }))) toast("バックアップを保存しました");
}
async function backupText(){
  const docs = {};
  for (const p of ["settings/categories", "settings/index", "settings/memos", "settings/recurring"]) { const b = await S.store.get(p); if (b) docs[p] = b; }
  for (const ym of (docs["settings/index"] && docs["settings/index"].months) || []) { const b = await S.store.get("months/" + ym); if (b) docs["months/" + ym] = b; }
  return JSON.stringify({ app: "my-cashbook", version: 1, exportedAt: new Date().toISOString(), docs });
}
/* 貼り付け用：ボタンを押したときに中身を準備し、もう一度押すとコピーする（iPhoneはクリック直後でないとコピーできないため） */
async function prepareCopy(){
  try { S.backupCopy = await backupText(); renderView(); toast("準備できました。「コピーする」を押してください"); }
  catch (e) { toast("データを読み込めませんでした。もう一度お試しください"); }
}
function copyBackup(){
  const text = S.backupCopy, box = $("#backupBox");
  const fallback = () => { if (box) { box.focus(); box.select(); } toast("下の文字を長押しして「すべてを選択」→「コピー」してください"); };
  try { navigator.clipboard.writeText(text).then(() => toast("コピーしました。独立版の「貼り付けて復元」に貼り付けてください"), fallback); } catch (e) { fallback(); }
}
function parseBackup(text, fromSync){
  try {
    const data = JSON.parse(String(text).trim().replace(/^\uFEFF/, ""));
    if (!data || data.app !== "my-cashbook" || !data.docs) throw 0;
    const docs = {};
    Object.keys(data.docs).forEach(k => { if (BACKUP_PATH.test(k) && data.docs[k] && typeof data.docs[k] === "object") docs[k] = data.docs[k]; });
    const months = Object.keys(docs).filter(k => k.startsWith("months/")).map(k => k.slice(7)).sort();
    const count = months.reduce((n, ym) => n + ((docs["months/" + ym].entries || []).length), 0);
    S.restore = { docs, months, count, at: data.exportedAt || "", fromSync: !!fromSync }; S.pasting = false; S.tab = "settings"; renderTabs(); renderView(); window.scrollTo(0, 0);
    return true;
  } catch (e) { if (!fromSync) toast("出納帳のバックアップとして読み取れませんでした。全文がそろっているか確認してください"); return false; }
}
function readBackup(file){
  const r = new FileReader();
  r.onload = () => parseBackup(r.result);
  r.onerror = () => toast("ファイルを読み込めませんでした");
  r.readAsText(file);
}
async function doRestore(){
  const { docs, months } = S.restore;
  try {
    for (const k of Object.keys(docs)) { if (k === "settings/index") continue; await S.store.mutate(k, () => clone(docs[k])); }
    await S.store.mutate("settings/index", b => { const m = new Set(((b && b.months) || []).concat(months)); return { months: Array.from(m).sort() }; });
    toast("復元しました（" + months.length + "か月分）");
    S.restore = null; renderView(); runRecurring();
  } catch (e) { toast(errMsg(e)); }
}
function exportMonth(){
  if (!window.XLSX) return saveBook(null);
  const list = S.entries, t = totals(list), wb = XLSX.utils.book_new();
  const sum = [["区分", "項目", "小分類", "金額", "構成比"]];
  ["inc", "exp"].forEach(type => {
    const tot = type === "inc" ? t.inc : t.exp;
    orderedCats(type, list).forEach(c => {
      const items = list.filter(e => e.t === type && e.c === c), v = items.reduce((s2, e) => s2 + e.a, 0);
      if (!v) return;
      sum.push([TYPE_LABEL[type], c, "", v, tot ? Math.round(v / tot * 1000) / 10 + "%" : ""]);
      if (items.some(e => e.s)) orderedSubs(type, c, items).forEach(sn => { const sv = items.filter(e => (e.s || "") === sn).reduce((s2, e) => s2 + e.a, 0); if (sv) sum.push(["", "", sn || NO_SUB, sv, Math.round(sv / v * 1000) / 10 + "%"]); });
    });
    sum.push([TYPE_LABEL[type] + "合計", "", "", tot, ""]); sum.push([]);
  });
  sum.push(["収支", "", "", t.bal, ""]);
  XLSX.utils.book_append_sheet(wb, sheet(sum, [10, 18, 22, 12, 8]), "集計");
  XLSX.utils.book_append_sheet(wb, sheet(detailRows(list), [12, 6, 18, 20, 12, 30]), "明細");
  saveBook(wb, "kakeibo_" + S.ym + ".xlsx");
}
async function exportYear(){
  if (!window.XLSX) return saveBook(null);
  const y = S.ym.slice(0, 4), yms = Array.from({ length: 12 }, (_, i) => y + "-" + pad(i + 1));
  let all = [];
  try { for (const ym of yms) { if (ym === S.ym) { all = all.concat(S.entries); continue; } if (!S.months.includes(ym)) continue; const b = await S.store.get("months/" + ym); all = all.concat((b && b.entries) || []); } }
  catch (e) { return toast("データを読み込めませんでした。もう一度お試しください"); }
  const head = ["項目"].concat(yms.map(m => Number(m.slice(5)) + "月"), ["年間合計"]);
  const rows = [head];
  const monthSum = (type, c, sn) => yms.map(m => all.filter(e => e.t === type && e.d.slice(0, 7) === m && (c == null || e.c === c) && (sn == null || (e.s || "") === sn)).reduce((s, e) => s + e.a, 0));
  const line = (label, arr) => [label].concat(arr, [arr.reduce((s, v) => s + v, 0)]);
  ["inc", "exp"].forEach(type => {
    rows.push(["【" + TYPE_LABEL[type] + "】"]);
    orderedCats(type, all).forEach(c => {
      rows.push(line(c, monthSum(type, c)));
      const items = all.filter(e => e.t === type && e.c === c);
      if (items.some(e => e.s)) orderedSubs(type, c, items).forEach(sn => { const arr = monthSum(type, c, sn); if (arr.some(v => v)) rows.push(line("　└ " + (sn || NO_SUB), arr)); });
    });
    rows.push(line(TYPE_LABEL[type] + "合計", monthSum(type, null))); rows.push([]);
  });
  const inc = monthSum("inc", null), exp = monthSum("exp", null);
  rows.push(line("収支", inc.map((v, i) => v - exp[i])));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet(rows, [18].concat(Array(12).fill(10), [12])), "年間集計");
  XLSX.utils.book_append_sheet(wb, sheet(detailRows(all), [12, 6, 18, 20, 12, 30]), "明細");
  saveBook(wb, "kakeibo_" + y + ".xlsx");
}
function copyTsv(){
  const text = detailRows(S.entries).map(r => r.map(v => String(v).replace(/[\t\n]/g, " ")).join("\t")).join("\n");
  const show = () => { S.copyText = text; renderView(); const b = $("#copyBox"); if (b) { b.focus(); b.select(); } };
  try { navigator.clipboard.writeText(text).then(() => toast("コピーしました。Excelに貼り付けてください"), show); } catch (e) { show(); }
}

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  const tabBtn = ev.target.closest(".tabs button");
  if (tabBtn) { S.tab = tabBtn.dataset.tab; S.armed = null; S.renaming = null; S.copyText = null; S.recForm = null; S.restore = null; S.backupCopy = null; S.pasting = false; S.tokenEdit = false; S.catOpen = null; S.subRenaming = null; if (S.tab !== "input" && S.form.id) S.form = blankForm(); renderTabs(); renderView(); window.scrollTo(0, 0); return; }
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, i = Number(b.dataset.i);
  const t = S.setType;
  if (act !== "delCat" && act !== "delEntry" && act !== "recDel" && act !== "syncOff" && act !== "delSub") S.armed = null;
  switch (act) {
    case "type": S.form.t = b.dataset.t; S.form.c = ""; S.form.s = ""; renderView(); break;
    case "cat": if (S.form.c !== b.dataset.c) S.form.s = ""; S.form.c = b.dataset.c; document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b)); renderSubs(); renderSugs(); break;
    case "sub": S.form.s = S.form.s === b.dataset.s ? "" : b.dataset.s; renderSubs(); break;
    case "sug": {
      S.form.m = b.dataset.m; const inp = $("#fMemo"); if (inp) inp.value = S.form.m;
      if (!S.form.c && (S.cats[S.form.t] || []).includes(b.dataset.c)) { S.form.c = b.dataset.c; document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.c === S.form.c)); }
      if (S.form.c === b.dataset.c && !S.form.s && b.dataset.s) S.form.s = b.dataset.s;
      renderSubs(); renderSugs(); break;
    }
    case "delMemo": { const m = b.dataset.m, mt = b.dataset.t; S.store.mutate("settings/memos", body => ({ items: ((body && body.items) || []).filter(x => !(x.m === m && x.t === mt)) })).catch(err => toast(errMsg(err))); break; }
    case "save": saveEntry(); break;
    case "cancel": S.form = blankForm(); S.tab = "list"; renderAll(); break;
    case "delEntry": deleteEntry(); break;
    case "edit": { const e = S.entries.find(x => x.id === b.dataset.id); if (!e) return; S.form = { id: e.id, origYm: e.d.slice(0, 7), d: e.d, t: e.t, c: e.c, a: String(e.a), m: e.m || "", r: e.r || null, s: e.s || "" }; S.tab = "input"; renderTabs(); renderView(); window.scrollTo(0, 0); break; }
    case "xlsxMonth": exportMonth(); break;
    case "repToggle": { const k = b.dataset.k; S.repOpen[k] = !S.repOpen[k]; renderView(); break; }
    case "xlsxYear": exportYear(); break;
    case "copyTsv": copyTsv(); break;
    case "setType": S.setType = b.dataset.t; S.renaming = null; S.catOpen = null; S.subRenaming = null; renderView(); break;
    case "up": case "down": { const j = act === "up" ? i - 1 : i + 1; S.catOpen = null; S.renaming = null; mutateCats(c => { const l = c[t]; if (j < 0 || j >= l.length) return false; [l[i], l[j]] = [l[j], l[i]]; }); break; }
    case "catOpen": { const k = t + ":" + i; S.catOpen = S.catOpen === k ? null : k; S.renaming = S.catOpen; S.subRenaming = null; renderView(); break; }
    case "catClose": S.catOpen = null; S.renaming = null; S.subRenaming = null; renderView(); break;
    case "addSub": {
      const cat = S.cats[t][i], name = (($("#newSub") || {}).value || "").trim();
      if (!name) return toast("小分類名を入力してください");
      if (subsOf(t, cat).includes(name)) return toast("同じ名前の小分類がすでにあります");
      const cur = subsOf(t, cat).slice();
      mutateCats(c => { c.sub[t][cat] = (c.sub[t][cat] || cur); c.sub[t][cat].push(name); }).then(() => { toast("「" + name + "」を追加しました"); const n = $("#newSub"); if (n) n.focus(); }); break;
    }
    case "subUp": case "subDown": {
      const cat = S.cats[t][i], j = Number(b.dataset.j), k2 = act === "subUp" ? j - 1 : j + 1, cur = subsOf(t, cat).slice();
      mutateCats(c => { const l = c.sub[t][cat] = (c.sub[t][cat] || cur); if (k2 < 0 || k2 >= l.length) return false; [l[j], l[k2]] = [l[k2], l[j]]; }); break;
    }
    case "delSub": {
      const cat = S.cats[t][i], j = Number(b.dataset.j), sk = "sub:" + t + ":" + i + ":" + j, cur = subsOf(t, cat).slice(), name = cur[j];
      if (S.armed !== sk) { S.armed = sk; renderView(); break; }
      S.armed = null; mutateCats(c => { const l = c.sub[t][cat] = (c.sub[t][cat] || cur); l.splice(j, 1); }).then(() => toast("「" + name + "」を削除しました")); break;
    }
    case "subRename": S.subRenaming = Number(b.dataset.j); renderView(); { const r = $("#subRenameInput"); if (r) { r.focus(); r.select(); } } break;
    case "subRenameCancel": S.subRenaming = null; renderView(); break;
    case "subRenameSave": renameSub(i, Number(b.dataset.j)); break;
    case "delCat": {
      const k = t + ":" + i;
      if (S.armed !== k) { S.armed = k; renderView(); break; }
      S.armed = null; const name = S.cats[t][i]; S.catOpen = null; S.renaming = null;
      mutateCats(c => { c[t].splice(i, 1); delete c.sub[t][name]; }).then(() => toast("「" + name + "」を削除しました")); break;
    }
    case "addCat": {
      const inp = $("#newCat"), name = (inp.value || "").trim();
      if (!name) return toast("項目名を入力してください");
      if (S.cats[t].includes(name)) return toast("同じ名前の項目がすでにあります");
      mutateCats(c => { c[t].push(name); }).then(() => toast("「" + name + "」を追加しました")); break;
    }
    case "rename": S.renaming = t + ":" + i; renderView(); { const r = $("#renameInput"); if (r) { r.focus(); r.select(); } } break;
    case "renameCancel": S.renaming = null; renderView(); break;
    case "renameSave": renameCat(i); break;
    case "backup": exportBackup(); break;
    case "syncConnect": syncConnect(); break;
    case "syncNow": syncNow(true); break;
    case "tokenEdit": S.tokenEdit = true; renderView(); { const t = $("#gNewToken"); if (t) t.focus(); } break;
    case "tokenCancel": S.tokenEdit = false; S.gNewToken = ""; renderView(); break;
    case "tokenSave": changeToken(); break;
    case "syncOverwrite": S.restore = null; renderView(); markDirty(); syncNow(true); break;
    case "syncLoad": syncLoad(); break;
    case "syncOff": {
      if (S.armed !== "sync") { S.armed = "sync"; renderView(); break; }
      S.armed = null; setSyncCfg({}); renderSyncStatus(); renderView(); toast("連携を解除しました"); break;
    }
    case "prepCopy": prepareCopy(); break;
    case "copyBackup": copyBackup(); break;
    case "pasteOpen": S.pasting = true; S.backupCopy = null; renderView(); { const t = $("#pasteBox"); if (t) t.focus(); } break;
    case "pasteDo": { const t = $("#pasteBox"); if (!t || !t.value.trim()) return toast("先にバックアップの内容を貼り付けてください"); parseBackup(t.value); break; }
    case "restoreCancel": S.restore = null; renderView(); break;
    case "restoreDo": doRestore(); break;
    case "recNew": S.recForm = blankRec(); renderView(); break;
    case "recEdit": { const r = S.rec.find(x => x.id === b.dataset.id); if (!r) return; S.recForm = { id: r.id, t: r.t, c: r.c, s: r.s || "", a: String(r.a), day: r.day, m: r.m || "", now: false }; renderView(); break; }
    case "recType": S.recForm.t = b.dataset.t; S.recForm.c = ""; S.recForm.s = ""; renderView(); break;
    case "recCancel": S.recForm = null; renderView(); break;
    case "recSave": saveRec(); break;
    case "recDel": {
      if (S.armed !== "rec") { S.armed = "rec"; renderView(); break; }
      const id = S.recForm.id; S.armed = null;
      S.store.mutate("settings/recurring", body => Object.assign({}, body, { items: ((body && body.items) || []).filter(x => x.id !== id) }))
        .then(() => { toast("定期登録を解除しました。記帳済みの明細は残ります"); S.recForm = null; renderView(); }, err => toast(errMsg(err)));
      break;
    }
  }
});
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id === "fAmount") { const digits = el.value.replace(/[^\d０-９]/g, "").replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)).replace(/^0+/, "").slice(0, 10); S.form.a = digits; el.value = digits ? Number(digits).toLocaleString("ja-JP") : ""; }
  else if (el.id === "rAmount") { const digits = el.value.replace(/[^\d０-９]/g, "").replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)).replace(/^0+/, "").slice(0, 10); S.recForm.a = digits; el.value = digits ? Number(digits).toLocaleString("ja-JP") : ""; }
  else if (el.id === "rMemo") S.recForm.m = el.value;
  else if (el.id === "gUrl") S.gUrl = el.value;
  else if (el.id === "gToken") S.gToken = el.value;
  else if (el.id === "gNewToken") S.gNewToken = el.value;
  else if (el.id === "fMemo") { S.form.m = el.value; renderSugs(); }
  else if (el.id === "fDate") { S.form.d = el.value; renderDayList(); }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.id === "restoreFile") { if (el.files && el.files[0]) readBackup(el.files[0]); el.value = ""; return; }
  if (!S.recForm) return;
  if (el.id === "rCat") { S.recForm.c = el.value; S.recForm.s = ""; renderView(); }
  else if (el.id === "rSub") S.recForm.s = el.value;
  else if (el.id === "rDay") S.recForm.day = Number(el.value);
  else if (el.id === "rNow") S.recForm.now = el.checked;
});
document.addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  if (ev.target.id === "newCat") { ev.preventDefault(); document.querySelector('[data-act="addCat"]').click(); }
  if (ev.target.id === "renameInput") { ev.preventDefault(); document.querySelector('[data-act="renameSave"]').click(); }
  if (ev.target.id === "newSub") { ev.preventDefault(); document.querySelector('[data-act="addSub"]').click(); }
  if (ev.target.id === "subRenameInput") { ev.preventDefault(); document.querySelector('[data-act="subRenameSave"]').click(); }
});
$("#prevM").addEventListener("click", () => { S.ym = shiftYM(S.ym, -1); S.copyText = null; watchMonth(); renderAll(); });
$("#nextM").addEventListener("click", () => { S.ym = shiftYM(S.ym, 1); S.copyText = null; watchMonth(); renderAll(); });

/* ---------- boot ---------- */
async function boot(){
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  S.store = db ? dbStore(db) : localStore();
  if (!db) {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    const baseMutate = S.store.mutate;
    S.store.mutate = async (p, fn) => { const r = await baseMutate(p, fn); if (r) markDirty(); return r; };
    renderSyncStatus();
    setTimeout(() => syncNow(false), 1500);
    window.addEventListener("online", () => syncNow(false));
    document.addEventListener("visibilitychange", () => { if (!document.hidden) syncNow(false); });
  }
  S.store.watch("settings/categories", body => { S.cats = body && body.exp ? body : clone(DEFAULT_CATS); if (S.tab === "input" || S.tab === "settings") renderView(); });
  S.store.watch("settings/index", body => { S.months = (body && body.months) || []; });
  S.store.watch("settings/memos", body => { S.memos = (body && body.items) || []; if (S.tab === "input") renderSugs(); else if (S.tab === "settings" && !S.renaming) renderView(); });
  S.store.watch("settings/recurring", body => { S.rec = (body && body.items) || []; if (S.tab === "settings" && !S.renaming && !S.recForm) renderView(); });
  watchMonth();
  renderAll();
  runRecurring();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) runRecurring(); });
}
renderSum(); renderTabs();
boot();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  // 新しい版が届いたら一度だけ読み込み直す（初回インストール時は除く）
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
    document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {}));
}
</script>
